<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Login</title>

<link rel="stylesheet" href="style.css">

<style>

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f4f4f4;
font-family:Poppins,sans-serif;
}

.login-box{

background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
width:320px;
text-align:center;

}

.login-box h2{

margin-bottom:20px;

}

.login-box input{

width:100%;
padding:12px;
margin:15px 0;
border:1px solid #ddd;
border-radius:8px;

}

.login-box button{

width:100%;
padding:12px;
border:none;
background:#0b57d0;
color:white;
border-radius:8px;
cursor:pointer;

}

</style>

</head>

<body>

<div class="login-box">

<h2>🔐 Admin Login</h2>

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">

Login

</button>

</div>

<script>

function login(){

const pass=document.getElementById("password").value;

if(pass==="123456"){

localStorage.setItem("adminLogged","true");

location.href="admin.html";

}else{

alert("Wrong Password");

}

}

</script>

</body>
</html>
