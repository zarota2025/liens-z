<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Panel | LIENS Z</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="admin.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<header class="header">

<div class="top-bar">

<button
class="menu-btn"
onclick="history.back()">

←

</button>

<div class="logo">

<img src="logo.png" alt="LIENS Z">

<span>LIENS Z</span>

</div>
<button id="logout-btn" class="logout-btn">
🚪 Logout
</button>
</div>

</header>

<section class="admin-page">

<h1 class="section-title">

👨‍💼 Admin Panel
<a href="orders.html" class="buy-btn">
📦 View Orders
</a>
</h1>
<div class="dashboard">

    <div class="dash-card">
        <h3>📦 Products</h3>
        <span id="products-count">0</span>
    </div>

    <div class="dash-card">
        <h3>🛒 Orders</h3>
        <span id="orders-count">0</span>
    </div>

    <div class="dash-card">
        <h3>💰 Revenue</h3>
        <span id="revenue-total">$0</span>
    </div>

    <div class="dash-card">
        <h3>❤️ Favorites</h3>
        <span id="favorites-count">0</span>
    </div>

</div>
<div class="admin-form">

<input
type="text"
id="product-name"
placeholder="Product Name">

<input
type="number"
id="product-price"
placeholder="Price">

<input
type="text"
id="product-category"
placeholder="Category">

<input
type="file"
id="product-image"
accept="image/*">
<input
type="number"
id="product-old-price"
placeholder="Old Price">

<input
type="text"
id="product-discount"
placeholder="Discount (مثال: -20%)">

<input
type="text"
id="product-badge"
placeholder="Badge (Best Seller / New)">
<button id="save-product">

➕ Add Product

</button>

</div>

<h2 class="section-title">

Products

</h2>

<div id="admin-products">

</div>

</section>

<script src="admin.js"></script>

</body>

</html>
