<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orders | LIENS Z</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="orders.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">

<div class="top-bar">

<button class="menu-btn" onclick="history.back()">
←
</button>

<div class="logo">

<img src="logo.png">

<span>LIENS Z</span>

</div>

</div>

</header>

<section class="orders-page">

<h1 class="section-title">

📦 Customer Orders

</h1>
  <div class="orders-stats">

<div class="stat-card pending">
<h3>Pending</h3>
<p id="pending-count">0</p>
</div>

<div class="stat-card processing">
<h3>Processing</h3>
<p id="processing-count">0</p>
</div>

<div class="stat-card shipped">
<h3>Shipped</h3>
<p id="shipped-count">0</p>
</div>

<div class="stat-card delivered">
<h3>Delivered</h3>
<p id="delivered-count">0</p>
</div>

</div>
<input
type="text"
id="search-order"
placeholder="🔍 Search by name, email or phone..."
class="search-order">
<div id="orders-list">

</div>
<div id="order-modal" class="order-modal">

    <div class="order-modal-content">

        <span id="close-modal" class="close-modal">&times;</span>

        <div id="order-details"></div>

    </div>

</div>
</section>
<!-- ================= INVOICE MODAL ================= -->

<div id="order-modal" class="modal">

    <div class="modal-content">

        <span id="close-modal" class="close">&times;</span>

        <div id="order-details"></div>

        <div class="invoice-buttons">

            <button id="print-invoice">
                🖨 Print Invoice
            </button>

            <button id="download-pdf">
                📄 Download PDF
            </button>

        </div>

    </div>

</div>

<!-- html2pdf -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script type="module" src="orders.js"></script>

</body>

</html>
