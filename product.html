<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details | LIENS Z</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="product.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="header">

<div class="top-bar">

<a href="index.html" class="back-btn">←</a>

<div class="logo">

<img src="logo.png" alt="LIENS Z">

<span>LIENS Z</span>

</div>

<div class="header-icons">

<span id="favorite-count">❤️ <span>0</span></span>

<a href="cart.html" id="cart-count">🛒 <span>0</span></a>

</div>

</div>

</header>

<section class="product-page">

<div class="product-gallery">

<img id="product-image" src="" alt="">

</div>

<div class="product-info">

<h1 id="product-title"></h1>

<div class="rating">

★★★★★

<span>(124 Reviews)</span>

</div>

<div class="price">

<span id="product-price"></span>

</div>

<p class="description">

Premium quality product made with the best materials.

Fast shipping worldwide.

30-day money-back guarantee.

</p>

<div class="quantity">

<button id="minus">−</button>

<span id="qty">1</span>

<button id="plus">+</button>

</div>

<div class="product-buttons">

<button id="add-cart" class="buy-btn">

🛒 Add to Cart

</button>

<button id="add-favorite" class="details-btn">

❤️ Favorite

</button>

</div>

<div class="shipping">

<p>🚚 Free Shipping</p>

<p>🔒 Secure Payment</p>

<p>📦 Fast Delivery</p>

</div>

</div>

</section>

<script src="product.js"></script>

</body>

</html>
